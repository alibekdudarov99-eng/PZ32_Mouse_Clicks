<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практическая работа</title>
</head>
<body>
    <div>Очки: <span id="score" class="score">0</span></div>
    <br>
    <button id="score-button" class="score-button">Нажми меня (Клик)</button>
    <br><br>
    <div id="double-card" class="double-card" style="border: 1px solid black; padding: 10px; display: inline-block; cursor: pointer;">
        Карточка игры (Двойной клик)
    </div>
    <br><br>
    <div id="hover-zone" class="hover-zone" style="border: 1px solid gray; padding: 20px; display: inline-block;">
        Зона для наведения мыши
    </div>
    <br><br>
    <div id="status" class="status">Статус программы готов к работе</div>
    <script src="js/script.js"></script>
</body>
</html>
